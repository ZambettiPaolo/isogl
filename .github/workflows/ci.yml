name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PREFIX: ${{ github.workspace }}/_install
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev xvfb

      - name: Build library and demo
        run: make -j"$(nproc)" PREFIX="$PREFIX"

      - name: Run tests
        run: xvfb-run -a -s "-screen 0 1280x720x24" make test

      - name: Install library
        run: make PREFIX="$PREFIX" install

      - name: Build isocad
        run: make -C apps/isocad PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"

      - name: Smoke-run isocad
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            timeout 3 ./apps/isocad/build/isocad || [ $? -eq 124 ]
